  - 5
  - 10
  - 20
  - 30
  - 60
  macd_fast_span: 12
  macd_slow_span: 26
  macd_signal_span: 9
  kdj_lookback_period: 9
  kdj_initial_k: 50.0
  kdj_initial_d: 50.0
  kdj_smoothing_alpha: 0.3333333333333333
  rsi_windows:
  - 6
  - 12
  - 24
  bollinger_window: 20
  bollinger_standard_deviation_multiplier: 2.0
  volume_ratio_window: 20
  epsilon: 1.0e-12
text_generation:
  system_prompt_path: prompts/technical_indicator_system_prompt.txt
  user_prompt_path: prompts/technical_indicator_user_prompt.txt
  api_base_url: http://localhost
  api_model_name: unused
  api_key_environment_variable: UNUSED_API_KEY
  requests_per_second: 80
  max_worker_count: 256
  request_timeout_seconds: 60
  max_retry_attempt_count: 8
  initial_retry_delay_seconds: 1.0
  retry_backoff_multiplier: 2.0
  retryable_status_codes:
  - 403
  - 408
  - 409
  - 425
  - 429
  - 500
  - 502
  - 503
  - 504
  - 520
  - 522
  - 524
  max_consecutive_failure_count: 20
  generation_checkpoint_file_name: technical_text_generation_progress.json
  generation_failure_log_file_name: technical_text_generation_failures.jsonl
  sample_validation_size: 50
  save_every_response_count: 10
  minimum_output_word_count: 180
  maximum_output_word_count: 280
  banned_phrases:
  - bullish
  - bearish
  - buy
  - sell
  - likely
  - expected
  - signal
  validation_random_seed: 7
  bandwidth_validation_tolerance: 0.005
  percent_b_validation_tolerance: 0.02
  require_zero_digit_output: true
  forbid_number_word_output: false
  require_single_paragraph_output: true
  require_local_indicator_consistency_check: true
  enable_word_count_check: true
  require_all_samples_to_pass: true
  enable_full_generation_after_validation: true
technical_text_encoder:
  backend_type: huggingface_transformers
  pretrained_model_name: intfloat/e5-mistral-7b-instruct
  api_base_url: null
  api_model_name: null
  api_key_environment_variable: null
  tokenizer_max_length: 512
  encoder_batch_size: 48
  cache_device: cuda
  local_model_cache_directory: data/model_cache
  output_embedding_dim: 4096
  pooling_strategy: last_token
  normalize_embeddings: true
  model_dtype: bfloat16
  instruction_prefix: 'Instruct: Encode the one-day-ahead predictive edge in this
    qualitative technical diagnosis, not the prevailing trend direction alone. Distinguish
    confirmed upside follow-through, bearish reversal or downside follow-through,
    and mixed low-edge equilibrium by prioritizing divergence, loss of thrust, oscillator
    confirmation or disagreement, volatility at extremes, and whether the final synthesis
    strengthens or undermines the current trend.

    Query: '
  requests_per_second: 1
  request_timeout_seconds: 60
  max_retry_attempt_count: 1
  initial_retry_delay_seconds: 1.0
  retry_backoff_multiplier: 1.0
  retryable_status_codes:
  - 500
  max_consecutive_failure_count: 1
  save_every_record_count: 10
  checkpoint_file_name: technical_embedding_progress.json
  failure_log_file_name: technical_embedding_failures.jsonl
  quota_exhaustion_error_codes:
  - insufficient_user_quota
news_encoder:
  backend_type: huggingface_transformers
  pretrained_model_name: csebuetnlp/mT5_multilingual_XLSum
  api_base_url: null
  api_model_name: null
  api_key_environment_variable: null
  tokenizer_max_length: 512
  encoder_batch_size: 16
  cache_device: cuda
  local_model_cache_directory: data/model_cache
  output_embedding_dim: 768
  pooling_strategy: mean
  normalize_embeddings: false
  model_dtype: float32
  instruction_prefix: ''
  requests_per_second: 1
  request_timeout_seconds: 60
  max_retry_attempt_count: 1
  initial_retry_delay_seconds: 1.0
  retry_backoff_multiplier: 1.0
  retryable_status_codes:
  - 500
  max_consecutive_failure_count: 1
  save_every_record_count: 10
  checkpoint_file_name: news_embedding_progress.json
  failure_log_file_name: news_embedding_failures.jsonl
  quota_exhaustion_error_codes:
  - insufficient_user_quota
model:
  framework_variant_name: ohlcv124_group_token_mixer_attention_side_adapter_factor_concat_logit_classifier_v1
  input_price_feature_count: 5
  technical_indicator_feature_count: 124
  technical_indicator_representation_dim: 128
  technical_indicator_mlp_hidden_dim: 64
  use_group_specific_technical_indicator_mlp_hidden_dims: false
  technical_indicator_group_mlp_hidden_dims:
  - 64
  - 64
  - 64
  - 64
  - 64
  - 64
  - 64
  - 64
  - 64
  technical_indicator_group_mlp_dropout_probability: 0.0
  use_controlled_technical_indicator_global_mixer: false
  technical_indicator_global_mixer_hidden_dim: 128
  technical_indicator_global_mixer_dropout_probability: 0.0
  technical_indicator_global_mixer_residual_alpha_initial_value: 1.0
  use_vector_technical_indicator_global_mixer_residual_alpha: false
  technical_indicator_group_token_dim: 32
  technical_indicator_group_token_mixer_layer_count: 1
  technical_indicator_group_token_mixer_head_count: 4
  technical_indicator_group_token_mixer_feed_forward_dim: 64
  technical_indicator_group_token_mixer_dropout_probability: 0.0
  use_technical_indicator_group_identity_embedding: true
  d_model: 192
  d_ff: 384
  num_layers: 2
  num_heads: 6
  num_classes: 1
  dropout_probability: 0.1
  gate_hidden_dim: 256
  use_raw_technical_indicator_branch: true
  use_technical_indicator_sequence_as_main_modality: true
  use_news_only_auxiliary_branch: false
  use_technical_indicator_pre_layer_norm: true
  tech_gate_bias_initial_value: 0.0
  news_gate_bias_initial_value: -1.0
  positional_embedding_initialization_std: 0.02
  no_news_embedding_initialization_std: 0.02
  use_post_injection_layer_norm: false
  use_layer_specific_text_projections: false
  trace_layer_specific_projected_text_features: false
  disable_outer_no_news_placeholder_embedding: true
  use_block_level_news_hard_mask: true
  use_shared_text_bottlenecks: false
  shared_text_bottleneck_dim: 256
  use_pre_projection_input_dropout: false
  input_dropout_probability: 0.2
training:
  batch_size: 64
  num_data_loader_workers: 0
  pin_memory: true
  num_epochs: 40
  learning_rate: 0.0001
  minimum_learning_rate: 1.0e-06
  scheduler_cosine_t_max_epoch_count: 40
  adam_beta_one: 0.9
  adam_beta_two: 0.98
  adam_epsilon: 1.0e-08
  weight_decay: 0.01
  label_smoothing: 0.0
  use_soft_macro_f1_loss: false
  soft_macro_f1_loss_weight: 0.0
  soft_macro_f1_epsilon: 1.0e-08
  tech_gate_regularization_weight: 0.0
